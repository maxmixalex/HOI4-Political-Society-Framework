name: Build and CWTools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwtools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install compiler
        run: python -m pip install -e .

      - name: Compiler and model tests
        run: python -m unittest discover -s tests -v

      - name: Compile both launcher mods
        run: python -m psf compile examples/vanilla/manifest.json --output dist

      - name: Check deterministic generation
        run: |
          python -m psf compile examples/vanilla/manifest.json --output build/reproducible
          diff -qr dist/psf build/reproducible/psf
          diff -qr dist/psf_vanilla_example build/reproducible/psf_vanilla_example

      - name: Real semantic CWTools validation and negative controls
        run: python tools/ci/validate.py --root dist --self-test

      - name: Verify downloadable package matches this source
        run: |
          python -m psf pack --root dist --output build/psf-0.1.0.zip
          cmp distributions/psf-0.1.0.zip build/psf-0.1.0.zip

      - name: Validate custom pack and equivalent JSON, TOML and YAML inputs
        run: |
          python -m psf compile examples/minimal/manifest.json --output build/minimal-json
          python -m psf compile examples/minimal/manifest.toml --output build/minimal-toml
          python -m psf compile examples/minimal/manifest.yaml --output build/minimal-yaml
          diff -qr build/minimal-json/psf_minimal build/minimal-toml/psf_minimal
          diff -qr build/minimal-json/psf_minimal build/minimal-yaml/psf_minimal
          python tools/ci/validate.py --root build/minimal-json --reports build/validation/minimal

      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwtools-diagnostics
          path: build/validation/
          if-no-files-found: error

      - name: Publish installable framework and vanilla example
        uses: actions/upload-artifact@v4
        with:
          name: psf-mods
          path: dist/
          if-no-files-found: error
